[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
cover-html=1
cover-html-dir=coverage

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 70

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv,build,dist
ignore = E203,W503

[pylint]
max-line-length = 100
disable = C0114,C0115,C0116
